services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: --dev --bind 0.0.0.0 --node-ip ${MEDIA_IP:?Set MEDIA_IP to the Docker host IPv4 reachable by viewers} --keys 'devkey: devsecret-for-local-development-only'
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
