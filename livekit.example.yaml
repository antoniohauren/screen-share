port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
keys:
  screen-share: replace-with-at-least-32-random-characters
# Optional built-in TURN: LiveKit issues ephemeral credentials in signaling.
# For UDP fallback, uncomment and open UDP 3478.
# turn:
#   enabled: true
#   udp_port: 3478
# For TLS fallback also configure domain, tls_port, cert_file and key_file.
# See DEPLOY-AWS.md; Caddy's HTTP proxy does not proxy TURN.
